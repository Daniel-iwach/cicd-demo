<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-subtle: #f1f5f9;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-text: #ffffff;

            --progress-text: #b45309;
            --done-text: #15803d;
            --danger: #ef4444;
            --danger-bg: #fee2e2;

            --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #090d16;
                --surface: #111827;
                --surface-subtle: #1f2937;
                --ink: #f9fafb;
                --muted: #9ca3af;
                --line: #374151;
                --primary: #6366f1;
                --primary-hover: #4f46e5;

                --progress-text: #fcd34d;
                --done-text: #6ee7b7;
                --danger: #f87171;
                --danger-bg: #7f1d1d;
            }
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        button, input, select, textarea { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 32px;
            background: var(--surface);
            padding: 24px 32px;
            border-radius: 20px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow-sm);
        }

        .header-info h1 {
            margin: 0;
            font-size: clamp(1.75rem, 3vw, 2.25rem);
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .sub {
            color: var(--muted);
            margin: 4px 0 0;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .btn {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 12px;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { background: var(--surface-subtle); border-color: var(--muted); }
        .btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--primary-text);
        }
        .btn.primary:hover { background: var(--primary-hover); }
        .btn.danger { color: var(--danger); border-color: var(--line); }
        .btn.danger:hover { background: var(--danger-bg); }
        .btn.small { padding: 6px 12px; font-size: 0.85rem; border-radius: 8px; }

        .banner {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 14px 20px;
            border-radius: 14px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .chip {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 999px;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--muted);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }
        .chip:hover { border-color: var(--muted); color: var(--ink); }
        .chip[aria-pressed="true"] {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--bg);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .board { grid-template-columns: 1fr; }
        }

        .col {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .col::before {
            content: '';
            position: absolute;
            top: 0; left: 20px; right: 20px;
            height: 4px;
            background: var(--col-accent, var(--primary));
            border-radius: 4px 4px 0 0;
        }

        .col h2 {
            margin: 4px 0 16px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .count {
            background: var(--surface-subtle);
            color: var(--muted);
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 32px 16px;
            font-size: 0.9rem;
            border: 2px dashed var(--line);
            border-radius: 14px;
            background: var(--surface-subtle);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: var(--muted);
        }

        .card h3 {
            margin: 0 0 6px;
            font-size: 1.05rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .card p {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 0.92rem;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .card-footer {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        select.status-select {
            border: 1px solid var(--line);
            background: var(--surface-subtle);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        dialog {
            border: none;
            border-radius: 24px;
            padding: 0;
            width: min(480px, 92vw);
            background: var(--surface);
            color: var(--ink);
            box-shadow: var(--shadow-lg);
        }
        dialog::backdrop {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }

        form {
            padding: 32px;
            display: grid;
            gap: 20px;
        }
        form h2 { margin: 0; font-size: 1.5rem; font-weight: 800; }

        label {
            display: grid;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea, select {
            border: 1px solid var(--line);
            background: var(--surface-subtle);
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            transition: border-color 0.2s ease;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            background: var(--surface);
        }
        textarea { resize: vertical; min-height: 100px; }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }
        .field-error { color: var(--danger); font-size: 0.8rem; font-weight: 500; min-height: 1em; }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translate(-50%, 20px);
            background: var(--ink);
            color: var(--bg);
            padding: 12px 24px;
            border-radius: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        #toast.error { background: var(--danger); color: #ffffff; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <header>
        <div class="header-info">
            <h1>Tareas</h1>
            <p class="sub" id="summary">Cargando...</p>
        </div>
        <button class="btn primary" id="newBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nueva tarea
        </button>
    </header>

    <div id="banner" class="banner" hidden></div>
    <div class="filters" id="filters" role="group" aria-label="Filtrar por estado"></div>
    <main class="board" id="board"></main>
</div>

<dialog id="dlg">
    <form id="form" novalidate>
        <h2 id="dlgTitle">Nueva tarea</h2>
        <label>Título
            <input id="fTitle" required maxlength="120" autocomplete="off" placeholder="Ej: Configurar despliegue">
            <span class="field-error" id="errTitle"></span>
        </label>
        <label>Descripción
            <textarea id="fDesc" maxlength="500" placeholder="Detalles opcionales de la tarea..."></textarea>
        </label>
        <label>Estado
            <select id="fStatus"></select>
        </label>
        <div class="form-actions">
            <button type="button" class="btn" id="cancelBtn">Cancelar</button>
            <button type="submit" class="btn primary" id="saveBtn">Guardar tarea</button>
        </div>
    </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
    const API_BASE = '';
    const API = API_BASE + '/api/v1/tasks';

    const STATUSES = [
      { value: 'PENDING',     label: 'Pendiente',   accent: 'var(--muted)' },
      { value: 'IN_PROGRESS', label: 'En progreso', accent: 'var(--progress-text)' },
      { value: 'COMPLETED',   label: 'Completada',  accent: 'var(--done-text)' }
    ];
    const F = { title: 'title', description: 'description', status: 'status' };

    const $ = id => document.getElementById(id);
    const board = $('board'), dlg = $('dlg'), form =$('form');
    let tasks = [], filter = '', editingId = null;

    async function api(path = '', options = {}) {
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      if (!res.ok) {
        let msg = 'Error ' + res.status;
        try {
          const body = await res.json();
          msg = body.message || body.detail || body.error || msg;
        } catch (_) {}
        throw new Error(msg);
      }
      return res.status === 204 ? null : res.json();
    }

    async function load() {
      try {
        tasks = await api(filter ? '?status=' + encodeURIComponent(filter) : '');
        $('banner').hidden = true;
      } catch (e) {
        tasks = [];
        const b = $('banner');
        b.hidden = false;
        b.textContent = 'No se pudo conectar con el backend (' + e.message + '). Verificá que el servicio esté corriendo.';
      }
      render();
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s ?? '';
      return d.innerHTML;
    }

    function renderFilters() {
      const items = [{ value: '', label: 'Todas' }, ...STATUSES];
      $('filters').innerHTML = items.map(s =>
        `<button class="chip" data-f="${s.value}" aria-pressed="${filter === s.value}">${s.label}</button>`
      ).join('');
    }

    function render() {
      renderFilters();
      const n = tasks.length;
      $('summary').textContent = n === 0 ? 'No hay tareas registradas' : n + (n === 1 ? ' tarea en total' : ' tareas en total');

      const cols = filter ? STATUSES.filter(s => s.value === filter) : STATUSES;
      board.style.gridTemplateColumns = filter ? '1fr' : '';
      board.innerHTML = cols.map(s => {
        const list = tasks.filter(t => t[F.status] === s.value);
        const cards = list.length
          ? list.map(card).join('')
          : `<div class="empty">Sin tareas en “${s.label.toLowerCase()}”</div>`;
        return `<section class="col" style="--col-accent:${s.accent}">
          <h2>${s.label}<span class="count">${list.length}</span></h2>${cards}</section>`;
      }).join('');
    }

    function card(t) {
      const opts = STATUSES.map(s =>
        `<option value="${s.value}" ${s.value === t[F.status] ? 'selected' : ''}>${s.label}</option>`).join('');
      return `<article class="card" data-id="${t.id}">
        <h3>${esc(t[F.title])}</h3>
        ${t[F.description] ? `<p>${esc(t[F.description])}</p>` : ''}
        <div class="card-footer">
          <select class="status-select" data-act="status" aria-label="Cambiar estado">${opts}</select>
          <span style="flex:1"></span>
          <button class="btn small" data-act="edit">Editar</button>
          <button class="btn small danger" data-act="delete">Eliminar</button>
        </div>
      </article>`;
    }

    function openForm(task) {
      editingId = task ? task.id : null;
      $('dlgTitle').textContent = task ? 'Editar tarea' : 'Nueva tarea';
      $('fTitle').value = task ? task[F.title] : '';
      $('fDesc').value = task ? (task[F.description] || '') : '';
      $('fStatus').innerHTML = STATUSES.map(s => `<option value="${s.value}">${s.label}</option>`).join('');
      $('fStatus').value = task ? task[F.status] : STATUSES[0].value;
      $('errTitle').textContent = '';
      dlg.showModal();
      $('fTitle').focus();
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const title = $('fTitle').value.trim();
      if (!title) { $('errTitle').textContent = 'Escribí un título para la tarea.'; return; }
      const body = {
        [F.title]: title,
        [F.description]: $('fDesc').value.trim(),
        [F.status]: $('fStatus').value
      };
      $('saveBtn').disabled = true;
      try {
        if (editingId) { await api('/' + editingId, { method: 'PUT', body: JSON.stringify(body) }); toast('Tarea actualizada'); }
        else { await api('', { method: 'POST', body: JSON.stringify(body) }); toast('Tarea creada'); }
        dlg.close();
        load();
      } catch (err) { toast(err.message, true); }
      finally { $('saveBtn').disabled = false; }
    });

    $('cancelBtn').onclick = () => dlg.close();$('newBtn').onclick = () => openForm();
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

    board.addEventListener('click', async e => {
      const btn = e.target.closest('[data-act]');
      if (!btn || btn.tagName === 'SELECT') return;
      const id = btn.closest('.card').dataset.id;
      const task = tasks.find(t => String(t.id) === id);
      if (btn.dataset.act === 'edit') openForm(task);
      if (btn.dataset.act === 'delete') {
        if (!confirm('¿Eliminar “' + task[F.title] + '”? Esta acción no se puede deshacer.')) return;
        try { await api('/' + id, { method: 'DELETE' }); toast('Tarea eliminada'); load(); }
        catch (err) { toast(err.message, true); }
      }
    });

    board.addEventListener('change', async e => {
      if (e.target.dataset.act !== 'status') return;
      const id = e.target.closest('.card').dataset.id;
      const task = tasks.find(t => String(t.id) === id);
      const body = { [F.title]: task[F.title], [F.description]: task[F.description] || '', [F.status]: e.target.value };
      try { await api('/' + id, { method: 'PUT', body: JSON.stringify(body) }); toast('Estado actualizado'); load(); }
      catch (err) { toast(err.message, true); load(); }
    });

    $('filters').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      filter = chip.dataset.f;
      load();
    });

    let tt;
    function toast(msg, isError = false) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'show' + (isError ? ' error' : '');
      clearTimeout(tt);
      tt = setTimeout(() => t.className = '', 3200);
    }

    load();
</script>
</body>
</html>
